  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Find the Architect">
  <meta property="og:title" content="Can you find Frank Lloyd Wright?">
  <meta property="og:description" content="Spot Fallingwater, the Guggenheim and eight more Wright buildings, then find the architect himself in the crowd.">
  <meta property="og:url" content="https://smartinov.github.io/marhitekta/architects/frank-lloyd-wright/">

</head>
<body class="game list-open">
  <header>
    <a href="../../" aria-label="Back to all architects">←</a>
    <h1 id="title">Find Frank Lloyd Wright</h1>
    <button id="count" aria-controls="checklist" aria-expanded="true" aria-live="polite"></button>
    <button id="bulb" aria-label="Hint for the next missing item">💡</button>
    <button id="out" aria-label="Zoom out">−</button>
    <button id="fit" aria-label="Show whole picture">Fit</button>
    <button id="in" aria-label="Zoom in">+</button>
  </header>
  <main>
    <div class="frame">
      <div class="view" id="view" tabindex="0" aria-label="Picture. Arrow keys pan, Enter guesses at the crosshair."><div class="stage" id="stage"></div></div>
      <div class="crosshair" aria-hidden="true"></div>
    </div>
    <aside id="checklist">
      <p>Drag to look around, pinch or use + / − to zoom, and tap what you find. Tap the counter to show or hide this list. Stuck? Tap 💡 again and again for a tighter circle.</p>
      <ol id="list"></ol>
    </aside>
  </main>
  <div id="toast" role="status"></div>
  <script src="game.js"></script>
  <script src="../../play.js"></script>
</body>
</html>
